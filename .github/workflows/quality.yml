name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            aural-api/package-lock.json
            aural-admin/package-lock.json
            aural-website/package-lock.json
      - run: npm ci --prefix aural-api
      - run: npm ci --prefix aural-admin
      - run: npm ci --prefix aural-website
      - run: npm test
        env:
          TOKIO_WORKER_THREADS: '2'
      - run: npm run quality
        env:
          DATABASE_URL: file:./dev.db
          VITE_API_BASE: https://api.example.invalid
          VITE_SITE_URL: https://www.example.invalid
          NUXT_PUBLIC_API_BASE: https://api.example.invalid
          NUXT_PUBLIC_SITE_URL: https://www.example.invalid
